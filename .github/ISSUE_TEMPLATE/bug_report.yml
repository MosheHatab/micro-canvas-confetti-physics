name: Bug report
description: Report a bug in micro-canvas-confetti-physics
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: "1. Call confetti() with...\n2. ..."
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser / OS
  - type: input
    id: version
    attributes:
      label: Package version
